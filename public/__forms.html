<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Form detection</title>
  </head>
  <body>
    <!-- Static form for Netlify deploy-time detection. Not linked from the app. -->
    <form name="contact" netlify data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="role" />
      <input type="text" name="state" />
      <input type="text" name="loans_per_month" />
      <textarea name="message"></textarea>
      <input name="bot-field" />
    </form>
  </body>
</html>
